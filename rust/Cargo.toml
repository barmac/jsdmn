[package]
name = "rsdmn"
version = "0.1.0"
edition = "2024"
description = "DMN 1.5 interpreter (FEEL + decision models) passing the DMN TCK"
license = "MIT"
repository = "https://github.com/barmac/jsdmn"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
fancy-regex = "0.20.2"
memchr = "2.8.3"
mimalloc = { version = "0.1.52", optional = true }
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
rustc-hash = "2.1.3"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

# `cargo build --profile profiling` for profilers (release + debug info)
[profile.profiling]
inherits = "release"
debug = true

[features]
mimalloc = ["dep:mimalloc"]
