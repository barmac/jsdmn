name: CI
on: [ push, pull_request ]
jobs:
  Build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22, 24, 26 ]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Cache DMN TCK
      uses: actions/cache@v4
      with:
        path: tmp/dmn-tck
        key: dmn-tck-${{ hashFiles('tasks/fetch-tck.js') }}
    - name: Build
      run: npm run all
    - name: Upload DMN TCK results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tck-results-node-${{ matrix.node-version }}
        path: tmp/tck-results
        if-no-files-found: ignore
